name: menuevo

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-menuevo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-menuevo}
      POSTGRES_DB: ${POSTGRES_DB:-menuevo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-menuevo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Wird gebraucht sobald Translation-/PDF-Jobs über BullMQ laufen.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
